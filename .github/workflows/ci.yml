name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' || github.base_ref == 'main' || github.base_ref == 'staging' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_URL: http://localhost:3100
      NUXT_DOCUMENTS_BUCKET: billing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          STATUS_JSON="$(supabase status -o json)"
          {
            echo "DATABASE_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL')"
            echo "NUXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')"
            echo "NUXT_PUBLIC_SUPABASE_KEY=$(echo "$STATUS_JSON" | jq -r '.PUBLISHABLE_KEY')"
            echo "NUXT_SUPABASE_SECRET_KEY=$(echo "$STATUS_JSON" | jq -r '.SECRET_KEY')"
          } >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Chaque projet tourne dans sa propre invocation plutôt qu'un seul `npx playwright test` :
      # le rate limiter IP (server/middleware/00-rate-limit.ts, 120 req/min) partage un seul bucket
      # mémoire pour tout le trafic e2e (une seule IP source, le runner CI). Sur un run combiné, le
      # budget peut s'épuiser avant la fin des 48 tests (observé en CI : 429 sur des endpoints
      # authentifiés, pris pour des bugs applicatifs). `reuseExistingServer` est `false` en CI, donc
      # chaque invocation relance un serveur Nitro neuf et repart avec un bucket vide.
      - name: Run Playwright tests (chromium)
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/chromium
        run: npx playwright test --project=chromium --output=test-results/chromium
      - name: Run Playwright tests (firefox)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/firefox
        run: npx playwright test --project=firefox --output=test-results/firefox
      - name: Run Playwright tests (webkit)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/webkit
        run: npx playwright test --project=webkit --output=test-results/webkit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
