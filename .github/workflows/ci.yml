name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'push' || github.base_ref == 'main' || github.base_ref == 'staging' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_SITE_URL: http://localhost:3100
      NUXT_DOCUMENTS_BUCKET: billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm version
        run: npm install -g npm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "DATABASE_URL=$DB_URL"
            echo "NUXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NUXT_PUBLIC_SUPABASE_KEY=$PUBLISHABLE_KEY"
            echo "NUXT_SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
